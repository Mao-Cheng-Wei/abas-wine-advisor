name: Brand finish once

on:
  push:
    paths:
      - 'scripts/brand_finish_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply brand finishing patch
        run: python scripts/brand_finish_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py requirements.txt
          git diff --cached --quiet || git commit -m "Finish product images and ABAS brand details"
          git push
